# Publishing @fabappai/sdk to npm.
#
# WHY OIDC AND NOT A TOKEN. This package runs in the END USER'S BROWSER of every app generated by every customer. A
# leaked publish token does not compromise Fabapp: it compromises the session of every person using every app of
# every customer, and there is no undo — the malicious version has already been installed. Trusted Publishing swaps
# the long-lived token for a short-lived OIDC token that npm validates against THIS repository and THIS workflow.
# There is no secret to leak: not in a repository secret, not on anybody's machine.
#
# BEFORE THE FIRST RELEASE, on npmjs.com: create the `fabappai` org, require 2FA for everybody with publish
# permission, and in the package's Settings turn on "Trusted Publisher" pointing at this repository + this file.
#
# Triggered by a TAG only. Never by a branch, never from a developer's machine — the habit of publishing "just to
# test" is exactly what leaks a credential.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # Trusted Publishing's OIDC token; without this npm refuses to publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1 (the version that knows how to swap the Actions OIDC token for
      # publish permission). Node 24 already ships an npm 11.x, so we do NOT install npm globally — it was exactly
      # `npm install -g npm@latest` that failed v0.1.1: npm@12 requires Node ^22.22 || ^24.15 || >=26, and the job
      # ran on Node 20. Asking for "the newest" couples this workflow to npm's release calendar; checking what
      # already came couples it to nothing.
      - name: npm can do Trusted Publishing
        run: |
          have="$(npm -v)"; need=11.5.1
          printf '%s\n%s\n' "$need" "$have" | sort -V -C \
            || { echo "::error::npm $have is older than $need — OIDC publishing does not exist in that version"; exit 1; }
          echo "npm $have · node $(node -v)"

      - run: npm ci --no-audit --no-fund

      # The tag is the source of truth for the version. Without this check, a v0.2.0 tag would publish
      # package.json's 0.1.0 — and a wrong number on npm is immutable.
      - name: the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "::error::tag $tag ≠ package.json $pkg"; exit 1; }

      - run: npm run lint:no-react
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # What goes to the registry is dist/, not src/. This step reads the real TARBALL (`npm pack`) looking for
      # things that must not leave home: a staff route, an internal endpoint, any literal shaped like a key. A
      # public package is the worst possible place to find out one of them leaked.
      - name: the tarball carries no internal route and no key
        run: |
          npm pack --silent >/dev/null
          tar -xzOf ./*.tgz > /tmp/bundle.txt
          if grep -nE 'fabapp\.ai/(staff|admin)|sk_live|sk_test|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}' /tmp/bundle.txt; then
            echo "::error::the tarball carries an internal route or something shaped like a credential"
            exit 1
          fi

      # `--provenance` records, next to the package, the signed proof that it came from THIS commit and THIS
      # workflow. It is what lets whoever installs verify the origin instead of taking our word for it.
      - run: npm publish --provenance --access public
