# The gate on every push and every PR. The SAME steps as `publish.yml`, minus the publish itself.
#
# Why it exists separately: publish triggers on a TAG only, and a tag is the worst moment to find out the typecheck
# broke — the version has already been decided, the commit has already been made, and the fix becomes a new tag.
# Here the signal arrives on the push that caused it.
#
# `lint:no-react` is the step that defines this package. An `import react` or an `import.meta.env` in here installs
# cleanly and only breaks at the user's runtime: in Node and in Next.js `import.meta.env` simply does not exist, and
# the API base would become `undefined`. A rule that is enforced, not remembered.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --no-audit --no-fund
      - name: the boundary — no React, no bundler global
        run: npm run lint:no-react
      # The Skill is DERIVED from AGENTS.md. Editing one without generating the other sets the two drifting in
      # silence, which is exactly the problem having a single source existed to solve.
      - name: the Skill is up to date with AGENTS.md
        run: npm run skill:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The package has to WORK outside a bundler — that is its entire thesis. A plain Node import against dist/
      # proves it in three lines; without this step, the first to find out would be whoever installed it.
      # ⚠️ A literal block (`|`), not a plain scalar: the `projectId: 'p'` inside has a colon followed by a space,
      # which YAML reads as a nested mapping. Written on a single line, this step takes the whole file down with
      # "mapping values are not allowed here" — and the workflow fails in 0s, before any step.
      - name: the build imports in plain Node
        run: |
          node -e "
            import('./dist/index.js').then((m) => {
              const client = m.createClient({ projectId: 'p' });
              if (!client.auth || !client.collection) throw new Error('incomplete surface');
            });
          "
